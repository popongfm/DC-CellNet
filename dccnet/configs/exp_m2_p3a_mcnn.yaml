# P3a target ablation arm: d_both setup (stride 2) with the MCNN/CSRNet geometry-adaptive kernel 0.3 * mean 3-NN distance (no radius cap)
_base_: base.yaml
model:
  pretrained: true
  out_stride: 2
  heads:
    density: false
loss:
  cc:
    enabled: false
train:
  epochs_max: 120
  patience: 20
data:
  split: splits/synthetic.json  # relative to --data-root
  stride: 2
  heatmap_sigma: mcnn
