# P3a target ablation arm: d_both setup (stride 2) with the repel code of Liang et al. instead of the adaptive Gaussian (alpha 0.8, support r/stride)
_base_: base.yaml
model:
  pretrained: true
  out_stride: 2
  heads:
    density: false
loss:
  cc:
    enabled: false
train:
  epochs_max: 120
  patience: 20
data:
  split: splits/synthetic.json  # relative to --data-root
  stride: 2
  heatmap_sigma: radius
  heatmap_shape: repel
