# P3a target ablation arm: d_both (adaptive sigma + stride 2) with neighbour divisor D = 8 (sigma <= d_nn / (8 stride))
_base_: base.yaml
model:
  pretrained: true
  out_stride: 2
  heads:
    density: false
loss:
  cc:
    enabled: false
train:
  epochs_max: 120
  patience: 20
data:
  split: splits/synthetic.json  # relative to --data-root
  stride: 2
  heatmap_sigma: adaptive
  heatmap_divisor: 8
